    M 30 20 C 30 18 31.5 17 33.5 17 L 36.5 17 C 38.5 17 40 18 40 20 L 40 30 L 50 30 C 52 30 53 31.5 53 33.5 L 53 36.5 C 53 38.5 52 40 50 40 L 40 40 L 40 50 C 40 52 38.5 53 36.5 53 L 33.5 53 C 31.5 53 30 52 30 50 L 30 40 L 20 40 C 18 40 17 38.5 17 36.5 L 17 33.5 C 17 31.5 18 30 20 30 L 30 30 Z
  " fill="url(#iconCrossGrad)" />

  <!-- Center Circular Core Dot -->
