      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0EA5A4" />
    </linearGradient>
    <linearGradient id="iconCrossGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
